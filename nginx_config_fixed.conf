server {
    listen 8044;
    listen 443 ssl;
    server_name mask.xjumping.top x.good2good.tech _;
    index index.html index.htm;
    root /www/wwwroot/XbxMask;

    # 设置默认字符集
    charset utf-8;

    # SSL证书配置
    ssl_certificate    /www/pem/x.good2good.tech_nginx/x.good2good.tech.pem;
    ssl_certificate_key    /www/pem/x.good2good.tech_nginx/x.good2good.tech.key;

    # SSL安全设置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 设置文件权限和访问控制
    location / {
        # 允许访问所有文件
        try_files $uri $uri/ /index.html;
        
        # 设置正确的MIME类型
        location ~* \.html$ {
            add_header Content-Type text/html;
        }
        
        location ~* \.css$ {
            add_header Content-Type text/css;
        }
        
        location ~* \.js$ {
            add_header Content-Type application/javascript;
        }
    }

    # 静态资源缓存优化
    location ~* \.(gif|jpg|jpeg|png|bmp|swf|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(js|css)$ {
        expires 12h;
        add_header Cache-Control "public";
        access_log off;
    }

    # 允许访问隐私政策和服务条款
    location ~* \.(html|htm)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # 禁止访问敏感文件（但允许必要的配置文件）
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project)$ {
        deny all;
        return 404;
    }

    # 禁止访问某些敏感文件类型
    location ~ \.(htaccess|htpasswd|ini|log|sh|inc|bak|sql)$ {
        deny all;
        return 404;
    }

    # 允许访问manifest.json（PWA需要）
    location = /web/manifest.json {
        add_header Content-Type application/json;
        expires 1d;
    }

    # 允许访问favicon
    location = /web/favicon.png {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 允许访问web图标
    location ~* ^/web/icons/.*\.(png|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 允许访问静态资源
    location /static/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # 允许访问assets
    location /assets/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # 处理Flutter web应用的特殊需求
    location /web/ {
        try_files $uri $uri/ /index.html;
    }

    # 错误页面配置
    error_page 404 /index.html;
    error_page 403 /index.html;

    # 日志配置
    access_log /www/wwwlogs/mask.xjumping.top.log;
    error_log /www/wwwroot/XbxMask/error.log;
}
